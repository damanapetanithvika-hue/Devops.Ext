<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Web Page</title>
</head>
<body>

  <!-- Main Heading -->
  <h1>Welcome to My Website</h1>

  <!-- Paragraph with Bold Text -->
  <p>This is a sample webpage created using <strong>HTML5</strong>.</p>

  <!-- Sub-heading and Unordered List -->
  <h2>Common Elements</h2>
  <ul>
    <li>Headings and paragraphs</li>
    <li>Hyperlinks and images</li>
    <li>Forms and buttons</li>
  </ul>

  <!-- Hyperlink -->
  <p>Learn more at <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>.</p>

  <!-- Image -->
  <img src="https://placeholder.com" alt="Sample placeholder image" width="150" height="150">

</body>
</html>
