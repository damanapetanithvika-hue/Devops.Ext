<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>Sign in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top left, #e8edff 0, transparent 38%), #f4f6fb;
    }

    .login-card {
      width: min(100%, 420px);
      padding: 40px;
      border: 1px solid #e8ebf2;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 60px rgb(34 48 84 / 10%);
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 14px;
      background: #4f46e5;
      color: #fff;
      font-size: 20px;
      font-weight: 750;
    }

    h1 { margin: 0; font-size: 28px; letter-spacing: -0.04em; }
    .intro { margin: 9px 0 28px; color: #687187; line-height: 1.5; }
    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 650;
    }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #d9deea;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: inherit;
      font: inherit;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #655ded;
      box-shadow: 0 0 0 3px rgb(79 70 229 / 14%);
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 72px; }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #4f46e5;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 22px;
      font-size: 13px;
    }

    .remember { display: inline-flex; align-items: center; gap: 8px; color: #596278; }
    .remember input { accent-color: #4f46e5; }
    a { color: #4f46e5; font-weight: 650; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .submit-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: background .15s, transform .15s;
    }

    .submit-button:hover { background: #4338ca; }
    .submit-button:active { transform: translateY(1px); }
    .message { min-height: 20px; margin: 14px 0 0; color: #b42318; font-size: 13px; }
    .signup { margin: 22px 0 0; color: #687187; text-align: center; font-size: 14px; }

    @media (max-width: 480px) {
      .login-card { padding: 30px 24px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">D</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to your account to continue.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="toggle-password" id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>

      <div class="options">
        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
        <a href="#forgot-password">Forgot password?</a>
      </div>

      <button class="submit-button" type="submit">Sign in</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="signup">New here? <a href="#sign-up">Create an account</a></p>
  </main>

  <script>
    const passwordInput = document.querySelector('#password');
    const toggleButton = document.querySelector('#toggle-password');
    const form = document.querySelector('#login-form');
    const message = document.querySelector('#message');

    toggleButton.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'text';
      passwordInput.type = isVisible ? 'password' : 'text';
      toggleButton.textContent = isVisible ? 'Show' : 'Hide';
      toggleButton.setAttribute('aria-pressed', String(!isVisible));
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      message.textContent = 'Form is ready to connect to your authentication service.';
      message.style.color = '#344054';
    });
  </script>
</body>
</html>
